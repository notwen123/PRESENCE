# Render blueprint for the ATTEST server: PRESENCE on Monad testnet (development mode: device check labelled).
# Secrets (set in the Render dashboard, never in git): MONAD_ATTESTOR_KEY, PRIVY_APP_ID, PRIVY_APP_SECRET.
services:
  - type: web
    name: presence-attest
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ATTEST_DEV_MODE
        value: "true"
      - key: ATTEST_DB
        value: /tmp/attest.db
      - key: MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: MONAD_REGISTRY
        value: "0x5519dacface816519ACa3ee3cD592fd4c61dE52B"
      - key: MONAD_VAULT
        value: "0xfC157D4b8D9573413a3A793056D7625eD972163B"
      - key: ATTEST_MISSIONS
        value: /app/missions_monad.json
      - key: FREEZE_PRICE
        value: "0.02"
      - key: DAILY_REWARD_CAP_PER_DEVICE
        value: "0.1"
      - key: AGENT_GUARD
        value: "0xdC3Ba526FF565D0c76131D54a30aFA3c55041B11"
      - key: PRIVY_AGENT_WALLET
        value: mu4ahzu41ifknuii096qo6c1
      - key: PRIVY_APP_ID
        sync: false
      - key: MONAD_ATTESTOR_KEY
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
