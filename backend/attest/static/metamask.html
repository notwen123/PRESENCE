<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACEDOWN · MetaMask</title>
<style>
 body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#f4f8f5;color:#111827;display:flex;min-height:100vh;align-items:center;justify-content:center}
 .c{background:#fff;border:1.5px solid #cfe6d6;border-radius:24px;padding:28px;max-width:420px;margin:20px;text-align:center}
 h1{font-size:24px;margin:0 0 8px} p{color:#4b5563} .ok{color:#15803d;font-weight:700} .err{color:#b42318}
 button{background:#15803d;color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;margin-top:10px}
</style></head><body><div class="c">
<h1 id="t">FACEDOWN on Monad</h1><p id="m">Connecting to MetaMask…</p><button id="b">Connect MetaMask</button>
</div><script>
const q = new URLSearchParams(location.search), T = document.getElementById("t"), M = document.getElementById("m"), B = document.getElementById("b");
const say = (t, m, cls) => { T.textContent = t; M.textContent = m; M.className = cls || ""; };
const ready = () => new Promise(res => {
  if (window.ethereum) return res(true);
  window.addEventListener("ethereum#initialized", () => res(true), { once: true });
  let n = 0; const t = setInterval(() => { if (window.ethereum || ++n > 50) { clearInterval(t); res(!!window.ethereum); } }, 100);
});
async function run() {
  B.style.display = "none";
  try {
    say("FACEDOWN on Monad", "Connecting to MetaMask…");
    if (!(await ready())) { B.style.display = "inline-block"; return say("Open in MetaMask", "This page must be opened inside the MetaMask app browser.", "err"); }
    const [account] = await ethereum.request({ method: "eth_requestAccounts" });
    let message, post;
    const monad = async () => {
      try { await ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x279f" }] }); }
      catch (e) {
        await ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId: "0x279f", chainName: "Monad Testnet",
          nativeCurrency: { name: "MON", symbol: "MON", decimals: 18 }, rpcUrls: ["https://testnet-rpc.monad.xyz"],
          blockExplorerUrls: ["https://testnet.monadvision.com"] }] });
      }
    };
    const send = async (tx) => { await monad(); return ethereum.request({ method: "eth_sendTransaction",
      params: [{ from: account, to: tx.to, data: tx.data, value: tx.value }] }); };
    if (q.get("freeze")) {
      const o = await (await fetch("/streak/freeze/" + q.get("freeze"))).json();
      if (o.wallet.toLowerCase() !== account.toLowerCase()) return say("Wrong account", "Switch MetaMask to " + o.wallet, "err");
      say("Confirm in MetaMask", "Pay for one streak freeze (half is burned on Monad).");
      const hash = await send(o.tx);
      say("Confirming on Monad…", hash.slice(0, 18) + "…");
      const r = await fetch("/streak/freeze/" + q.get("freeze"), { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ signature: "-", stake_transaction: btoa(hash) }) });
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      return say("Done ✓", "Freeze bought. Tap the FACEDOWN notification (or switch back to FACEDOWN).", "ok");
    }
    if (q.get("code")) {
      message = "Link MetaMask to FACEDOWN\ncode: " + q.get("code");
      post = (signature) => fetch("/wallet/link/" + q.get("code"), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ address: account, signature }) });
    } else {
      const s = await (await fetch("/session/" + q.get("session") + "/siwe")).json();
      if (s.wallet.toLowerCase() !== account.toLowerCase()) return say("Wrong account", "Switch MetaMask to " + s.wallet, "err");
      message = s.message;
      post = async (signature) => {
        let stake_transaction;
        if (s.stake) {
          say("Confirm the stake", "Lock " + (parseInt(s.stake.value, 16) / 1e18) + " MON in the FACEDOWN vault on Monad.");
          const hash = await send(s.stake);
          stake_transaction = btoa(hash);
          say("Confirming on Monad…", hash.slice(0, 18) + "…");
        }
        return fetch("/session/" + q.get("session") + "/authorize", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify(stake_transaction ? { signature, stake_transaction } : { signature }) });
      };
    }
    say("Sign in MetaMask", "Approve the signature request to continue.");
    const signature = await ethereum.request({ method: "personal_sign", params: [message, account] });
    const r = await post(signature);
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    say("Done ✓", "Tap the FACEDOWN notification (or switch back to FACEDOWN). It continues by itself.", "ok");
    const back = "intent://return#Intent;scheme=facedown;package=com.presence;end";
    B.textContent = "Back to FACEDOWN"; B.onclick = () => { location.href = back; }; B.style.display = "inline-block";
    setTimeout(() => { location.href = back; }, 600);
  } catch (e) { say("Not signed", e.message || String(e), "err"); B.style.display = "inline-block"; }
}
B.onclick = run; ready().then(ok => ok ? run() : say("Tap the button", "Tap Connect MetaMask to continue."));
</script></body></html>
